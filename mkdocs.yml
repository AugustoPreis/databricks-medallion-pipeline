site_name: Databricks Medallion Pipeline
site_description: Pipeline de dados com Arquitetura Medalhão no Databricks Free Edition
site_author: Augusto Thomasi
docs_dir: docs

theme:
  name: material
  language: pt
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Modo escuro
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Introdução:
    - Databricks Free Edition: introducao/databricks.md
    - Arquitetura Medalhão: introducao/arquitetura-medalhao.md
    - Delta Lake: introducao/delta-lake.md
    - Modelagem Dimensional (Kimball): introducao/kimball.md
  - Notebooks:
    - "001 - Preparando Ambiente": notebooks/preparando-ambiente.md
    - "002 - Landing (Extração)": notebooks/landing.md
    - "003 - Bronze": notebooks/bronze.md
    - "004 - Silver (Data Quality)": notebooks/silver.md
    - "005 - Gold (Dimensional)": notebooks/gold.md
    - "006 - Destruindo Ambiente": notebooks/destruindo-ambiente.md
  - Jobs & Pipelines: jobs.md
